apiVersion: v1
kind: PersistentVolume
metadata:
  name: lab2-pv
spec:
  capacity:
    storage: 256Mi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/lab2-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab2-pvc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: manual
  resources:
    requests:
      storage: 256Mi
